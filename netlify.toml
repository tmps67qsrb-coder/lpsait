[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/votes"
  to = "/.netlify/functions/votes"
  status = 200

[[redirects]]
  from = "/users.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.db*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
